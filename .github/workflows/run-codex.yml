name: Run Codex

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt for Codex CLI'
        required: true
        default: 'update CHANGELOG for next release'
      approvalMode:
        description: 'Approval mode (suggest, auto-edit, full-auto)'
        required: false
        default: 'auto-edit'

jobs:
  run-codex:
    name: Run Codex CLI
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Skip if OpenAI not configured
        if: env.OPENAI_API_KEY == ''
        run: |
          echo 'Skipping Run Codex: OPENAI_API_KEY not set'
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Codex CLI
        if: env.OPENAI_API_KEY != ''
        run: npm install -g @openai/codex

      # Pass workflow_dispatch inputs via env: rather than ${{ … }} interpolation
      # to prevent shell injection via the prompt or approvalMode fields.
      - name: Run Codex
        if: env.OPENAI_API_KEY != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_QUIET_MODE: '1'
          CODEX_APPROVAL_MODE: ${{ inputs.approvalMode }}
          CODEX_PROMPT: ${{ inputs.prompt }}
        run: |
          # Whitelist approval mode (codex accepts: suggest, auto-edit, full-auto).
          case "$CODEX_APPROVAL_MODE" in
            suggest|auto-edit|full-auto) ;;
            *) echo "Invalid approvalMode: $CODEX_APPROVAL_MODE" >&2; exit 1 ;;
          esac
          codex --approval-mode "$CODEX_APPROVAL_MODE" --quiet "$CODEX_PROMPT"

      - name: Commit changes
        if: env.OPENAI_API_KEY != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'chore: update via Codex' || echo 'No changes to commit'