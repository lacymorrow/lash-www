# TypeScript type check
#
# LAC-3685: type checking moved out of the Vercel build. Inside `next build`
# on Vercel's 4-core/8GB build machines the "Running TypeScript" phase OOMs
# (SIGKILL) or hangs into the 45-min build timeout whenever no warm build
# cache is restored, so `next.config.ts` sets
# `typescript.ignoreBuildErrors: true` and this workflow is the enforcement
# point instead. A standalone `tsc --noEmit` is cheap (~30s, ~2 GB).

name: Typecheck

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # next-env.d.ts and .next/types are gitignored; without them tsc can't
      # resolve image imports (*.png/*.jpg) or typed routes. `next typegen`
      # generates both in a few seconds without building the app.
      #
      # LAC-5732: typegen loads next.config.ts with NODE_ENV=production, and
      # `env: { ...getDerivedSecrets() }` there makes src/config/secrets.ts
      # refuse to derive secrets from the public BASE_URL. Vercel has the real
      # APP_SECRET, so deploys were fine; only Actions lacked it, and main had
      # no green typecheck for a week. A per-run throwaway value satisfies the
      # guard: this job generates types and never serves a request or signs a
      # session, so the value is worthless the moment the runner exits. Keep it
      # inline and generated. Do not store a repo secret, do not commit a fixed
      # placeholder, and do not weaken the guard in src/.
      - name: Generate Next.js types
        run: APP_SECRET=$(openssl rand -hex 32) bun x next typegen

      - name: Typecheck
        run: bun run typecheck
