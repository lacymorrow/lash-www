name: E2E Tests

# PR-only: main merges are already covered by the PR run — see LAC-2964.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
  NEXT_PUBLIC_FEATURE_AUTH_CREDENTIALS_ENABLED: "true"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Playwright's webServer serves this build via `next start` in CI
      # (see playwright.config.ts, LAC-2687) — do not remove.
      - name: Build
        run: bun run build

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          CI: "true"
          PORT: 3000

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
